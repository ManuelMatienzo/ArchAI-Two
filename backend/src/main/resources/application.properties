# ── Servidor y Puerto Dinámico (Render / Railway / AWS / Heroku) ──────────────
server.port=${PORT:8000}
server.address=0.0.0.0
spring.application.name=archai-backend
logging.level.org.mongodb.driver=WARN
spring.task.scheduling.pool.size=4

# ── Base de Datos Dinámica (PostgreSQL en la Nube / Fallback H2 Local) ────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./.archai/localdb;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── Consola H2 (Solo desarrollo offline) ──────────────────────────────────────
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# ── CORS ──────────────────────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4200,*}

# ── JWT (CU-01: token firmado con expiración configurable) ────────────────────
archai.jwt.secreto=${ARCHAI_JWT_SECRETO:}
archai.jwt.expiracion-minutos=${ARCHAI_JWT_EXPIRACION_MINUTOS:480}

# ── Migraciones versionadas de Base de Datos (Flyway) ─────────────────────────
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ── Límite de Subida de Archivos XMI / Proyectos ──────────────────────────────
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# ── Inteligencia Artificial Multimodal (CU-07: OCR y Visión de Diagramas) ─────
archai.ia.gemini-api-key=${GEMINI_API_KEY:${VITE_GEMINI_API_KEY:}}
archai.ia.gemini-model=${GEMINI_MODEL:${VITE_GEMINI_MODEL:gemini-flash-latest}}

# ── Notificaciones Push (CU-23: Alertas Críticas en Móvil) ────────────────────
# Punto único de integración de Firebase: coloca el JSON del service account en una ruta
# segura (o su contenido Base64) y activa el canal. Sin estas variables el backend sigue
# funcionando y las alertas quedan registradas como "omitidas".
archai.push.fcm.habilitado=${ARCHAI_PUSH_FCM_HABILITADO:false}
archai.push.fcm.credenciales=${ARCHAI_PUSH_FCM_CREDENCIALES:}
archai.push.fcm.project-id=${ARCHAI_PUSH_FCM_PROJECT_ID:}
archai.push.expo.habilitado=${ARCHAI_PUSH_EXPO_HABILITADO:true}
archai.push.expo.url=${ARCHAI_PUSH_EXPO_URL:https://exp.host/--/api/v2/push/send}



