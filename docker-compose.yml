version: '3.8'

services:
  # ==============================================================================
  # BACKEND SPRING BOOT 3 (Java 17) - Conectado a Supabase PostgreSQL
  # ==============================================================================
  archai-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: archai-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?Configura la base relacional de prueba en el .env privado}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?Configura el usuario en el .env privado}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Configura la contraseña en el .env privado}
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      SPRING_JPA_DDL_AUTO: update
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      CORS_ALLOWED_ORIGINS: "*"
      ARCHAI_JWT_SECRETO: ${ARCHAI_JWT_SECRETO:?Configura una clave JWT privada}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      ARCHAI_CLAUDE_FALLBACK_ENABLED: ${ARCHAI_CLAUDE_FALLBACK_ENABLED:-true}
      SPRING_DATA_MONGODB_URI: ${SPRING_DATA_MONGODB_URI:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}

  # ==============================================================================
  # FRONTEND REACT + VITE + NGINX
  # ==============================================================================
  archai-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_ARCHAI_API_URL: ${VITE_ARCHAI_API_URL:-http://localhost:8000}
    container_name: archai-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - archai-backend
